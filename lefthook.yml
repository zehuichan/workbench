# https://lefthook.dev/configuration/

pre-commit:
  # 串行执行（不设 parallel），避免与 typecheck 同时运行导致低配机内存/CPU 瞬时飙升。
  # lint 仅检查暂存文件并自动修复后回填，大幅降低负载；typecheck 仍需全量。
  jobs:
    - name: oxlint
      glob: '*.{js,jsx,ts,tsx,vue,cjs,mjs,cts,mts}'
      exclude:
        - '**/src/api/generated/**'
      run: pnpm exec oxlint --fix --type-aware --threads=4 --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{js,jsx,ts,tsx,vue,cjs,mjs,cts,mts,json,jsonc}'
      exclude:
        - '**/src/api/generated/**'
      run: pnpm exec oxfmt --threads=4 --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: eslint
      glob: '*.{js,jsx,ts,tsx,vue,cjs,mjs,cts,mts}'
      exclude:
        - '**/src/api/generated/**'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    - name: stylelint
      glob: '*.{vue,css,html}'
      run: pnpm exec stylelint --fix {staged_files}
      stage_fixed: true
    - name: typecheck
      run: pnpm typecheck

post-merge:
  commands:
    install:
      run: pnpm install

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
